version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Installs quarantine releases for 7 days (uv exclude-newer). Wait one day
    # longer so bumps never land inside that window and fail the locked
    # install. Security updates bypass this cooldown.
    cooldown:
      default-days: 8
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
