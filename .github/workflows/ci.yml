name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & dead code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"

      - name: Install dependencies (with dev extras)
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Classify PR commit subjects
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_commit_subjects.py "$BASE_SHA"

      - name: Classify pushed main commit subjects
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.after }}
        run: python scripts/check_commit_subjects.py "$BASE_SHA" "$HEAD_SHA"

      - name: Classify complete unreleased main history
        if: github.event_name == 'push'
        env:
          HEAD_SHA: ${{ github.event.after }}
        run: python scripts/check_commit_subjects.py --unreleased "$HEAD_SHA"

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Dead-code gate
        run: uv run python -m pytest -q tests/test_dead_code.py

  test:
    name: Test (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"

      - name: Install dependencies (with dev extras)
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run python -m pytest -q
