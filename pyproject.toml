[project]
name = "podsave"
version = "0.1.0"
description = "YouTube videos into curated Obsidian notes — diarized transcripts, top-10 insights."
authors = [{name = "davisbuilds"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "typer>=0.26.8,<1.0.0",
  "rich>=15.0.0,<16.0.0",
  "pydantic>=2.13.0,<3.0.0",
  "yt-dlp>=2026.7.4",
  "assemblyai>=0.64.26,<1.0.0",
  "openai>=2.32.0,<3.0.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0,<10.0.0",
  "ruff>=0.15.0,<1.0.0",
]

[project.scripts]
podsave = "podsave.cli:main"

[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podsave"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM", "ERA", "RUF", "PIE"]

[tool.ruff.lint.per-file-ignores]
# Test stub classes mimic external SDK response shapes; mutable class attrs are fine.
"tests/**" = ["RUF012"]
